<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sem conexão — LUPA3D</title>
  <style>
    :root {
      --cor-fundo: #f7f7f8;
      --cor-card: #ffffff;
      --cor-texto: #1a1a1a;
      --cor-borda: #e2e2e5;
      --cor-marca: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --cor-fundo: #121214;
        --cor-card: #1c1c1f;
        --cor-texto: #f0f0f0;
        --cor-borda: #2e2e33;
        --cor-marca: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cor-fundo);
      color: var(--cor-texto);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 1.5rem;
    }
    .caixa {
      max-width: 360px;
      text-align: center;
      background: var(--cor-card);
      border: 1px solid var(--cor-borda);
      border-radius: 1rem;
      padding: 2rem 1.5rem;
    }
    .logo {
      font-weight: 800;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    .logo span {
      background: var(--cor-marca);
      color: white;
      padding: 0.1rem 0.4rem;
      border-radius: 0.3rem;
    }
    .icone { font-size: 2.5rem; margin-bottom: 0.75rem; }
    h1 { font-size: 1.15rem; margin: 0 0 0.5rem; }
    p { font-size: 0.9rem; opacity: 0.75; margin: 0 0 1.25rem; line-height: 1.4; }
    button {
      background: var(--cor-marca);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 0.65rem 1.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="caixa">
    <div class="logo">LUPA<span>3D</span></div>
    <div class="icone" aria-hidden="true">📡</div>
    <h1>Sem conexão com a internet</h1>
    <p>Os preços mudam todo dia, então o LUPA3D precisa estar online pra mostrar dados atualizados. Confira sua conexão e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
